server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users/**
            - id: activity-service
              uri: lb://activity-service
              predicates:
                - Path=/api/activities/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
